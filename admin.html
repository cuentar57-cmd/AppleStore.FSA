<!DOCTYPE html><html lang="es" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Apple Store FSA</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#080808;--card:#18181a;--text:#f5f5f7;--muted:#9b9ba0;--border:rgba(255,255,255,.1);--input:#101010;--red:#ff3b30;--green:#34c759}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}.login,.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login{position:fixed;inset:0;z-index:10;background:var(--bg)}.box{width:min(430px,100%);background:var(--card);border:1px solid var(--border);border-radius:26px;padding:28px}.brand{font-size:1.8rem;font-weight:900;margin-bottom:22px}.field{margin:12px 0}.input{width:100%;background:var(--input);border:1px solid var(--border);color:#fff;border-radius:14px;padding:14px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;background:#f5f5f7;color:#080808;margin-top:10px}.secondary{background:#29292c;color:#fff;border:1px solid var(--border)}.rate{font-size:2.5rem;font-weight:900;margin:12px 0}.label{font-size:.75rem;font-weight:900;color:var(--muted);text-transform:uppercase}.status{font-size:.85rem;color:var(--muted);margin-top:14px}.ok{color:var(--green)}.err{color:var(--red)}.error{display:none;color:var(--red);margin-bottom:10px}.error.show{display:block}</style></head><body><div class="login" id="loginScreen"><div class="box"><div class="brand">Apple Store FSA</div><div class="error" id="loginError">Usuario o contraseña incorrectos</div><div class="field"><input id="loginUser" class="input" placeholder="Usuario" autocomplete="username"></div><div class="field"><input id="loginPass" class="input" type="password" placeholder="Contraseña" autocomplete="current-password"></div><button class="btn" id="loginBtn">Ingresar</button></div></div><div class="shell hidden" id="adminShell"><div class="box"><div class="brand">Cotización del dólar</div><div class="label">USD → ARS</div><div class="rate" id="ratePreview">$ 1.570</div><input id="dollarRate" class="input" type="number" min="1" step="1"><button class="btn" id="saveDollarBtn">Guardar</button><button class="btn secondary" id="openFullAdminBtn">Productos</button><div class="status" id="status">Cargando…</div></div></div><script>const API='https://script.google.com/macros/s/AKfycbwfIrEDy_7_Sh9jS3jygkezRfefpZ69R_GJeQpans-4GFt_0jVaW_mMgW4q5rnY9Ej0dQ/exec';const USER_HASH='b6c3b22607c2d2b73c9a7a8a3ff56f8e23011e83310c55beb8716b1e49794707';const PASS_HASH='e8599473b5b06e53859b2cb35d816000f1527aab682d81e084e9eabcd3fc5960';const SESSION='asf_admin_dollar_session';let products=[];function fmt(n){return '$ '+Number(n||0).toLocaleString('es-AR')}function usdOf(p){return Number(p.priceUsd||p.precioUsd||p.precio_usd||p.USD||p.usd||0)||0}function arsOf(p){return Number(p.priceArs||p.precioArs||p.precio_ars||p.ARS||p.ars||0)||0}async function hash(v){const b=new TextEncoder().encode(v),d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function login(){loginError.classList.remove('show');if(await hash(loginUser.value.trim())===USER_HASH&&await hash(loginPass.value)===PASS_HASH){sessionStorage.setItem(SESSION,'1');showAdmin()}else loginError.classList.add('show')}function showAdmin(){loginScreen.classList.add('hidden');adminShell.classList.remove('hidden');loadProducts()}async function loadProducts(){try{const r=await fetch(API+'?action=getProducts&ts='+Date.now(),{cache:'no-store'}),d=await r.json();products=Array.isArray(d)?d:(d.products||[]);let rate=1570;for(const p of products){const u=usdOf(p),a=arsOf(p);if(u>0&&a>0){rate=Math.round(a/u);break}}dollarRate.value=rate;ratePreview.textContent=fmt(rate);status.textContent='Listo';status.className='status ok'}catch(e){dollarRate.value=1570;ratePreview.textContent=fmt(1570);status.textContent='Error al cargar';status.className='status err'}}async function saveDollar(){const rate=Math.round(Number(dollarRate.value));if(!rate||rate<=0)return;saveDollarBtn.disabled=true;saveDollarBtn.textContent='Guardando…';const next=products.map(p=>{const usd=usdOf(p);return usd?{...p,priceArs:Math.round(usd*rate)}:p});try{const r=await fetch(API+'?action=saveProducts',{method:'POST',body:JSON.stringify({products:next})}),d=await r.json();if(d&&d.ok===false)throw new Error();products=next;ratePreview.textContent=fmt(rate);status.textContent='Guardado';status.className='status ok'}catch(e){status.textContent='No se pudo guardar';status.className='status err'}finally{saveDollarBtn.disabled=false;saveDollarBtn.textContent='Guardar'}}dollarRate.addEventListener('input',()=>ratePreview.textContent=fmt(dollarRate.value));loginBtn.addEventListener('click',login);loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});saveDollarBtn.addEventListener('click',saveDollar);openFullAdminBtn.addEventListener('click',()=>location.href='products-admin.html');if(sessionStorage.getItem(SESSION)==='1')showAdmin();</script></body></html>
