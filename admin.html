<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Apple Store FSA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#18181a;--text:#f5f5f7;--muted:#9b9ba0;--border:rgba(255,255,255,.1);--input:#101010;--red:#ff3b30;--shadow:0 26px 80px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input{font-family:inherit}.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.12),transparent 48%),var(--bg);padding:18px}.login-box{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:30px;padding:34px;box-shadow:var(--shadow)}.apple{width:48px;height:48px;margin:0 auto 14px;display:block;fill:var(--text)}.brand{text-align:center;font-size:2rem;font-weight:900;letter-spacing:-.07em}.sub{text-align:center;color:var(--muted);font-size:.84rem;margin:8px 0 26px}.field{margin-bottom:14px}.label{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}.input{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}.input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.08)}.error{display:none;background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.25);color:var(--red);padding:10px;border-radius:14px;margin-bottom:14px;font-size:.84rem}.error.show{display:block}.btn{width:100%;border:none;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--text);color:var(--bg)}
</style>
</head>
<body>
<div class="login">
  <div class="login-box">
    <svg class="apple" viewBox="0 0 24 24"><path d="M16.365 1.43c0 1.14-.42 2.16-1.26 3.06-.9.96-1.98 1.51-3.15 1.42-.15-1.11.44-2.29 1.23-3.05.87-.85 2.29-1.47 3.18-1.43zM20.7 17.18c-.55 1.28-.82 1.85-1.53 2.98-.99 1.5-2.38 3.38-4.11 3.4-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.02-4.07 1-1.73-.02-3.05-1.71-4.04-3.21-2.77-4.22-3.06-9.17-1.35-11.8 1.22-1.87 3.14-2.97 4.94-2.97 1.83 0 2.98 1.01 4.5 1.01 1.47 0 2.37-1.01 4.49-1.01 1.6 0 3.3.87 4.51 2.37-3.96 2.17-3.32 7.82.69 9.22z"/></svg>
    <div class="brand">Apple Store FSA</div>
    <div class="sub">Panel de administración</div>
    <div class="error" id="loginError">Usuario o contraseña incorrectos</div>
    <div class="field"><div class="label">Usuario</div><input id="loginUser" class="input" autocomplete="username" placeholder="Usuario"></div>
    <div class="field"><div class="label">Contraseña</div><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Contraseña"></div>
    <button class="btn" id="loginBtn">Ingresar</button>
  </div>
</div>
<script>
const SOURCE='https://raw.githubusercontent.com/cuentar57-cmd/AppleStore.FSA/a1480cbc7a1c8f7b965eb8b7e61d171459eb2f03/admin.html';
const USER_HASH='b6c3b22607c2d2b73c9a7a8a3ff56f8e23011e83310c55beb8716b1e49794707';
const PASS_HASH='e8599473b5b06e53859b2cb35d816000f1527aab682d81e084e9eabcd3fc5960';
async function sha256(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function enter(){
  loginError.classList.remove('show');
  const [u,p]=await Promise.all([sha256(loginUser.value.trim()),sha256(loginPass.value)]);
  if(u!==USER_HASH||p!==PASS_HASH){loginPass.value='';loginError.classList.add('show');return}
  sessionStorage.setItem('asf_admin_session','1');
  try{
    const r=await fetch(SOURCE,{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el panel');
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){loginError.textContent='No se pudo cargar el panel. Volvé a intentar.';loginError.classList.add('show')}
}
loginBtn.addEventListener('click',enter);
loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
</script>
</body>
</html>
