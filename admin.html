function driveImage(id){return 'https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w1200'}
function buildDriveCatalog(){
  const images={};
  const colors={};
  Object.entries(DRIVE_FILES).forEach(([model,items])=>{
    images[model]=items.map(([,id])=>driveImage(id));
    colors[model]=items.map(([name])=>name);
  });
  return {images,colors};
}
function patchPanel(html){
  const {images,colors}=buildDriveCatalog();
  const imgCode='const MODEL_IMAGES = '+JSON.stringify(images,null,2)+';';
  const colorCode='const MODEL_COLORS = '+JSON.stringify(colors,null,2)+';';
  html=html.replace(/const MODEL_IMAGES = \{[\s\S]*?\n\};/,imgCode);
  html=html.replace(/const MODEL_COLORS = \{[\s\S]*?\n\};/,colorCode);
  html=html.replace('Colores PNG del modelo','Imágenes del modelo · Google Drive');
  html=html.replace('Elegí un color y el panel carga la imagen PNG del modelo. También podés subir una propia a Cloudinary.','Elegí un color y el panel carga automáticamente la imagen vinculada desde Google Drive. También podés subir una propia a Cloudinary.');
  return html;
}
async function sha256(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function enter(){
  loginError.classList.remove('show');
  const [u,p]=await Promise.all([sha256(loginUser.value.trim()),sha256(loginPass.value)]);
  if(u!==USER_HASH||p!==PASS_HASH){loginPass.value='';loginError.classList.add('show');return}
  sessionStorage.setItem('asf_admin_session','1');
  try{
    const r=await fetch(SOURCE,{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el panel');
    const html=patchPanel(await r.text());
    document.open();document.write(html);document.close();
  }catch(e){loginError.textContent='No se pudo cargar el panel. Volvé a intentar.';loginError.classList.add('show')}
}
loginBtn.addEventListener('click',enter);
loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
