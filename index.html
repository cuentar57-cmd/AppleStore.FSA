<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Apple Store FSA</title><style>html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}</style></head><body><div id="loading">Cargando Apple Store FSA…</div><script>
const SOURCE='https://raw.githubusercontent.com/cuentar57-cmd/AppleStore.FSA/04aef0f08963ea5e6945dab7d9dff1f0657abc9a/index.html';
const API='https://script.google.com/macros/s/AKfycbwfIrEDy_7_Sh9jS3jygkezRfefpZ69R_GJeQpans-4GFt_0jVaW_mMgW4q5rnY9Ej0dQ/exec';
function injectOrdering(html){const marker='function renderProducts(){';const helper=`function productSortComparator(a,b){const textA=\`${'${a.name||\'\'} ${a.model||\'\'}'}\`.toLowerCase();const textB=\`${'${b.name||\'\'} ${b.model||\'\'}'}\`.toLowerCase();const modelNumber=txt=>{const m=txt.match(/iphone\\s*(\\d+)/i);return m?Number(m[1]):Number.MAX_SAFE_INTEGER};const modelA=modelNumber(textA),modelB=modelNumber(textB);if(modelA!==modelB)return modelA-modelB;const nameCmp=String(a.name||a.model||'').localeCompare(String(b.name||b.model||''),'es',{numeric:true,sensitivity:'base'});if(nameCmp!==0)return nameCmp;const usdA=Number(productUsdPrice(a))||0,usdB=Number(productUsdPrice(b))||0;if(usdA!==usdB)return usdA-usdB;return 0;}\n`;if(!html.includes('function productSortComparator(a,b)'))html=html.replace(marker,helper+marker);const needle='  if(!filtered.length){';if(!html.includes('filtered.sort(productSortComparator);'))html=html.replace(needle,'  filtered.sort(productSortComparator);\n'+needle);return html}
function injectTechnology(html){html=html.replace('<option value="accesorios">Accesorios</option>','<option value="accesorios">Accesorios</option><option value="tecnologia">Más Tecnología</option>');html=html.replace('<button class="filter-btn" data-cat="airpods" onclick="setFilter(this)">AirPods</button>','<button class="filter-btn" data-cat="airpods" onclick="setFilter(this)">AirPods</button><button class="filter-btn" data-cat="tecnologia" onclick="setFilter(this)">Más Tecnología</button>');html=html.replace("const otros = filtered.filter(p => !['sellados','seminuevos'].includes(productGroupKey(p)));","const tecnologia = filtered.filter(p => String(p.category||'').toLowerCase()==='tecnologia');\n  const otros = filtered.filter(p => !['sellados','seminuevos'].includes(productGroupKey(p)) && String(p.category||'').toLowerCase()!=='tecnologia');");html=html.replace("productSectionHTML('Otros productos Apple', 'Accesorios, iPad, MacBook, Apple Watch, AirPods y más.', otros)","productSectionHTML('Otros productos Apple', 'Accesorios, iPad, MacBook, Apple Watch, AirPods y más.', otros),\n    productSectionHTML('Más Tecnología', 'Parlantes, computadoras y más tecnología.', tecnologia)");return html}
function inferRate(rows){for(const p of rows||[]){const u=Number(p.priceUsd||p.precioUsd||p.precio_usd||p.USD||p.usd||0)||0;const a=Number(p.priceArs||p.precioArs||p.precio_ars||p.ARS||p.ars||0)||0;if(u>0&&a>0){const r=a/u;if(Number.isFinite(r)&&r>0)return Math.round(r)}}return 1570}
function injectDollarRate(html,rate){const n=Number(rate);if(!Number.isFinite(n)||n<=0)return html;html=html.replace(/DOLLAR_RATE:\s*[0-9.]+\s*,/,'DOLLAR_RATE: '+n+',');html=html.replace(/return priceNumber\(CONFIG\.DOLLAR_RATE\) \|\| [0-9.]+;/,'return priceNumber(CONFIG.DOLLAR_RATE) || '+n+';');return html}
function cleanStoreCopy(html){
  const replacements=[
    ['Catálogo premium de iPhone, iPad, MacBook, Apple Watch, AirPods y accesorios.','iPhone, iPad, MacBook, Apple Watch, AirPods y accesorios en un solo lugar.'],
    ['Una tienda simple, limpia y fácil de actualizar.','Encontrá el equipo que estás buscando y consultá disponibilidad al instante.'],
    ['Equipos Apple premium.','Potencia y rendimiento para todos los días.'],
    ['Bloques editables para mostrar beneficios reales del negocio.','Comprá con información clara, garantía y atención personalizada.'],
    ['<div class="info-card"><h3>Diseño responsive</h3><p>Optimizada para celular, tablet y escritorio con estética blanca y negra tipo Apple.</p></div>','<div class="info-card"><h3>Compra fácil</h3><p>Consultá modelos, stock y precios desde cualquier dispositivo.</p></div>'],
    ['Catálogo Apple blanco y negro.','Tecnología Apple en Formosa.'],
    ['Equipo premium Apple. Consultá disponibilidad, color, estado y precio actualizado.','Consultá disponibilidad, color, estado y precio actualizado.'],
    ['iPhone Pro con excelente rendimiento, cámara avanzada y diseño premium.','iPhone Pro con excelente rendimiento y cámara avanzada.'],
    ['Audio premium con cancelación de ruido y estuche USB-C.','Audio con cancelación de ruido y estuche USB-C.']
  ];
  for(const [from,to] of replacements) html=html.split(from).join(to);
  return html;
}
(async()=>{try{const [pageResult,dataResult]=await Promise.allSettled([fetch(SOURCE,{cache:'no-store'}),fetch(API+'?action=getProducts&ts='+Date.now(),{cache:'no-store'})]);if(pageResult.status!=='fulfilled'||!pageResult.value.ok)throw new Error('No se pudo cargar la tienda');let html=cleanStoreCopy(injectTechnology(injectOrdering(await pageResult.value.text())));if(dataResult.status==='fulfilled'&&dataResult.value.ok){try{const d=await dataResult.value.json();const rows=Array.isArray(d)?d:(d.products||[]);html=injectDollarRate(html,inferRate(rows))}catch(e){}}document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='No se pudo cargar la tienda. Recargá la página.'}})();
</script></body></html>
