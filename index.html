<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Store FSA</title>
<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}
</style>
</head>
<body>
<div id="loading">Cargando Apple Store FSA…</div>
<script>
const SOURCE='https://raw.githubusercontent.com/cuentar57-cmd/AppleStore.FSA/04aef0f08963ea5e6945dab7d9dff1f0657abc9a/index.html';

function injectOrdering(html){
  const marker='function renderProducts(){';
  const helper=`function productSortComparator(a,b){
  const textA = \`${'${a.name || \'\'} ${a.model || \'\'}'}\`.toLowerCase();
  const textB = \`${'${b.name || \'\'} ${b.model || \'\'}'}\`.toLowerCase();

  const modelNumber = txt => {
    const m = txt.match(/iphone\\s*(\\d+)/i);
    return m ? Number(m[1]) : Number.MAX_SAFE_INTEGER;
  };

  const modelA = modelNumber(textA);
  const modelB = modelNumber(textB);
  if(modelA !== modelB) return modelA - modelB;

  const nameA = String(a.name || a.model || '');
  const nameB = String(b.name || b.model || '');
  const nameCmp = nameA.localeCompare(nameB,'es',{numeric:true,sensitivity:'base'});
  if(nameCmp !== 0) return nameCmp;

  const usdA = Number(productUsdPrice(a)) || 0;
  const usdB = Number(productUsdPrice(b)) || 0;
  const arsA = Number(productArsPrice(a)) || 0;
  const arsB = Number(productArsPrice(b)) || 0;
  const priceA = usdA || (arsA ? arsA / dollarRate() : Number.MAX_SAFE_INTEGER);
  const priceB = usdB || (arsB ? arsB / dollarRate() : Number.MAX_SAFE_INTEGER);
  if(priceA !== priceB) return priceA - priceB;

  return String(a.storage || '').localeCompare(String(b.storage || ''),'es',{numeric:true,sensitivity:'base'});
}
`;

  if(!html.includes('function productSortComparator(a,b)')){
    html=html.replace(marker,helper+marker);
  }

  const needle='  if(!filtered.length){';
  if(!html.includes('filtered.sort(productSortComparator);')){
    html=html.replace(needle,'  filtered.sort(productSortComparator);\n'+needle);
  }
  return html;
}

(async()=>{
  try{
    const r=await fetch(SOURCE,{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar la tienda');
    const html=injectOrdering(await r.text());
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='No se pudo cargar la tienda. Recargá la página.';
    console.error(e);
  }
})();
</script>
</body>
</html>
