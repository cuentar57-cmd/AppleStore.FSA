<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Store FSA</title>
<style>html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}</style>
</head>
<body>
<div id="loading">Cargando Apple Store FSA…</div>
<script>
const SOURCE='https://raw.githubusercontent.com/cuentar57-cmd/AppleStore.FSA/04aef0f08963ea5e6945dab7d9dff1f0657abc9a/index.html';
const API='https://script.google.com/macros/s/AKfycbwfIrEDy_7_Sh9jS3jygkezRfefpZ69R_GJeQpans-4GFt_0jVaW_mMgW4q5rnY9Ej0dQ/exec';
function injectOrdering(html){const marker='function renderProducts(){';const helper=`function productSortComparator(a,b){const textA=\`${'${a.name||\'\'} ${a.model||\'\'}'}\`.toLowerCase();const textB=\`${'${b.name||\'\'} ${b.model||\'\'}'}\`.toLowerCase();const modelNumber=txt=>{const m=txt.match(/iphone\\s*(\\d+)/i);return m?Number(m[1]):Number.MAX_SAFE_INTEGER};const modelA=modelNumber(textA),modelB=modelNumber(textB);if(modelA!==modelB)return modelA-modelB;const nameCmp=String(a.name||a.model||'').localeCompare(String(b.name||b.model||''),'es',{numeric:true,sensitivity:'base'});if(nameCmp!==0)return nameCmp;const usdA=Number(productUsdPrice(a))||0,usdB=Number(productUsdPrice(b))||0,arsA=Number(productArsPrice(a))||0,arsB=Number(productArsPrice(b))||0;const priceA=usdA||(arsA?arsA/dollarRate():Number.MAX_SAFE_INTEGER),priceB=usdB||(arsB?arsB/dollarRate():Number.MAX_SAFE_INTEGER);if(priceA!==priceB)return priceA-priceB;return String(a.storage||'').localeCompare(String(b.storage||''),'es',{numeric:true,sensitivity:'base'});}\n`;if(!html.includes('function productSortComparator(a,b)'))html=html.replace(marker,helper+marker);const needle='  if(!filtered.length){';if(!html.includes('filtered.sort(productSortComparator);'))html=html.replace(needle,'  filtered.sort(productSortComparator);\n'+needle);return html}
function inferRate(rows){for(const p of rows||[]){const u=Number(p.priceUsd||p.precioUsd||p.precio_usd||p.USD||p.usd||0)||0;const a=Number(p.priceArs||p.precioArs||p.precio_ars||p.ARS||p.ars||0)||0;if(u>0&&a>0){const r=a/u;if(Number.isFinite(r)&&r>0)return Math.round(r)}}return 1570}
function injectDollarRate(html,rate){const n=Number(rate);if(!Number.isFinite(n)||n<=0)return html;html=html.replace(/DOLLAR_RATE:\s*[0-9.]+\s*,/,'DOLLAR_RATE: '+n+',');html=html.replace(/return priceNumber\(CONFIG\.DOLLAR_RATE\) \|\| [0-9.]+;/,'return priceNumber(CONFIG.DOLLAR_RATE) || '+n+';');return html}
(async()=>{try{const [pageResult,dataResult]=await Promise.allSettled([fetch(SOURCE,{cache:'no-store'}),fetch(API+'?action=getProducts&ts='+Date.now(),{cache:'no-store'})]);if(pageResult.status!=='fulfilled'||!pageResult.value.ok)throw new Error('No se pudo cargar la tienda');let html=injectOrdering(await pageResult.value.text());if(dataResult.status==='fulfilled'&&dataResult.value.ok){try{const d=await dataResult.value.json();const rows=Array.isArray(d)?d:(d.products||[]);html=injectDollarRate(html,inferRate(rows))}catch(e){console.warn('No se pudo detectar la cotización publicada',e)}}document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='No se pudo cargar la tienda. Recargá la página.';console.error(e)}})();
</script>
</body>
</html>
