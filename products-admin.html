<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panel · Apple Store FSA</title><style>html,body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:flex;align-items:center;justify-content:center}</style></head><body><div id="loading">Cargando panel…</div><script>
const SOURCE='https://raw.githubusercontent.com/cuentar57-cmd/AppleStore.FSA/a1480cbc7a1c8f7b965eb8b7e61d171459eb2f03/admin.html';
const EXTRA=`<style>
@media(max-width:900px){body{overflow-x:hidden}.app{display:block!important}.side{width:min(82vw,310px)!important;left:calc(-1 * min(82vw,310px))!important;box-shadow:18px 0 55px rgba(0,0,0,.55);z-index:100!important}.side.open{left:0!important}.main{width:100%!important;min-width:0!important}.topbar{padding:0 12px!important;gap:8px}.content{padding:14px 12px!important}.stats{grid-template-columns:1fr 1fr!important}.toolbar{align-items:stretch!important}.toolbar-left{width:100%!important}.toolbar .input,.toolbar .select{width:100%!important;min-width:0!important}.table-wrap{width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}.menuBtn{display:inline-flex!important;min-width:44px!important;min-height:44px!important}.side-close{display:flex!important}.modal{max-height:88vh!important}.modal-body{padding:16px!important}.modal-foot{padding:12px 16px!important}.grid{grid-template-columns:1fr!important}}
.side-close{display:none;position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text);align-items:center;justify-content:center;font-size:24px;z-index:3}.dollar-sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:none;align-items:flex-end;justify-content:center;padding:16px}.dollar-sheet.open{display:flex}.dollar-card{width:min(460px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px;margin-bottom:max(0px,env(safe-area-inset-bottom))}.dollar-card h2{margin:0 0 18px;font-size:1.45rem}.dollar-card input{font-size:18px}.dollar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.dollar-status{min-height:22px;margin-top:10px;font-size:.8rem;color:var(--muted)}
</style>
<div class="dollar-sheet" id="dollarSheet"><div class="dollar-card"><h2>Cotización del dólar</h2><div class="field"><div class="label">USD → ARS</div><input class="input" id="mobileDollar" type="number" min="1" step="1" inputmode="numeric"></div><div class="dollar-actions"><button class="btn btn-ghost" id="closeDollar">Cancelar</button><button class="btn btn-primary" id="saveMobileDollar">Guardar</button></div><div class="dollar-status" id="dollarStatus"></div></div></div>
<script>
(function(){
const API='https://script.google.com/macros/s/AKfycbwfIrEDy_7_Sh9jS3jygkezRfefpZ69R_GJeQpans-4GFt_0jVaW_mMgW4q5rnY9Ej0dQ/exec';
function n(v){return Number(v)||0} function usd(p){return n(p.priceUsd||p.precioUsd||p.precio_usd||p.USD||p.usd)} function ars(p){return n(p.priceArs||p.precioArs||p.precio_ars||p.ARS||p.ars)}
const side=document.getElementById('side');if(side&&!side.querySelector('.side-close')){const x=document.createElement('button');x.className='side-close';x.type='button';x.textContent='×';x.setAttribute('aria-label','Cerrar menú');x.onclick=()=>side.classList.remove('open');side.appendChild(x)}
document.querySelectorAll('.nav-item').forEach(el=>{el.addEventListener('click',()=>{if(innerWidth<=900&&side)side.classList.remove('open')})});
const cfg=[...document.querySelectorAll('.nav-item')].find(el=>el.textContent.toLowerCase().includes('configur'));if(cfg){cfg.onclick=null;cfg.addEventListener('click',async e=>{e.preventDefault();document.getElementById('dollarSheet').classList.add('open');document.getElementById('dollarStatus').textContent='Cargando…';try{const r=await fetch(API+'?action=getProducts&ts='+Date.now(),{cache:'no-store'});const d=await r.json();const ps=Array.isArray(d)?d:(d.products||[]);let rate=1570;for(const p of ps){if(usd(p)>0&&ars(p)>0){rate=Math.round(ars(p)/usd(p));break}}document.getElementById('mobileDollar').value=rate;document.getElementById('dollarStatus').textContent=''}catch(_){document.getElementById('mobileDollar').value=1570;document.getElementById('dollarStatus').textContent='No se pudo leer la cotización actual.'}})}
document.getElementById('closeDollar').onclick=()=>document.getElementById('dollarSheet').classList.remove('open');
document.getElementById('saveMobileDollar').onclick=async()=>{const rate=Math.round(n(document.getElementById('mobileDollar').value)),st=document.getElementById('dollarStatus'),btn=document.getElementById('saveMobileDollar');if(rate<1){st.textContent='Ingresá un valor válido.';return}btn.disabled=true;st.textContent='Guardando…';try{const r=await fetch(API+'?action=getProducts&ts='+Date.now(),{cache:'no-store'});const d=await r.json();let ps=Array.isArray(d)?d:(d.products||[]);ps=ps.map(p=>usd(p)>0?{...p,priceArs:Math.round(usd(p)*rate)}:p);const wr=await fetch(API+'?action=saveProducts',{method:'POST',body:JSON.stringify({products:ps})});const out=await wr.json();if(out&&out.ok===false)throw new Error(out.error||'Error');st.textContent='Guardado.';setTimeout(()=>{document.getElementById('dollarSheet').classList.remove('open');if(typeof loadProducts==='function')loadProducts()},650)}catch(e){st.textContent='No se pudo guardar.'}finally{btn.disabled=false}};
})();
<\/script>`;
fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(html=>{html=html.replace('</body>',EXTRA+'</body>');document.open();document.write(html);document.close()}).catch(()=>{document.getElementById('loading').textContent='No se pudo cargar el panel.'});
</script></body></html>
